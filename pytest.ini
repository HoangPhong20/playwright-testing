[pytest]
addopts = -ra -q
testpaths = tests
markers =
    smoke: Quick smoke coverage for critical flows.
    regression: Broader regression coverage.
    cart: Cart-specific scenarios.
    search: Search and listing scenarios.
    negative: Negative scenarios for invalid or unexpected inputs.
    edge: Edge-case scenarios for boundary and unusual behavior.
    navigation: Navigation and routing scenarios.
    ui: UI visibility and render validation scenarios.
    product: Product detail scenarios.
